name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-test.txt
      - run: python tools/fetch_forge_sources.py
      - run: python -m compileall -q scripts skinmatch_core.py tests tools
      - run: python -m ruff check scripts skinmatch_core.py tests tools
      - run: python -m unittest discover -s tests -v
